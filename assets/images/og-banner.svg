      <text x="85" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#E2E8F0" text-anchor="middle">📡 20,000+ Channels</text>

      <rect x="185" y="0" width="170" height="42" rx="10" fill="#101522" stroke="#263247" stroke-width="1" />
      <text x="270" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#E2E8F0" text-anchor="middle">🥊 Live Sports &amp; PPV</text>

