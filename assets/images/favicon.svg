<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#080B14" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#263247" stroke-width="6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />

  <!-- Geometric Streaming Ring (Subtle) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Crescent Moon Symbol (Luna) -->
  <path d="M 295 108 C 215 110 148 174 148 256 C 148 338 215 402 295 404 C 235 385 190 326 190 256 C 190 186 235 127 295 108 Z" 
        fill="url(#crescentGrad)" filter="url(#glow)" />

  <!-- Central Streaming Play Pulse (Stream) -->
  <path d="M 242 195 L 340 256 L 242 317 Z" fill="url(#sparkGrad)" filter="url(#glow)" />

  <!-- High-Tech Core Spark -->
  <circle cx="340" cy="256" r="6" fill="#FFFFFF" />
  <circle cx="256" cy="142" r="3.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="372" cy="190" r="4" fill="#60A5FA" opacity="0.9" />
  <circle cx="360" cy="335" r="3.5" fill="#22D3EE" opacity="0.8" />
</svg>